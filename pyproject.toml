[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-texto"
version = "0.1.0"
description = "Saca el texto de un video de YouTube: subtitulos si hay, si no transcribe el audio con Whisper."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "yt-dlp",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0", "numpy"]

[project.scripts]
yt-texto = "yt_texto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
